name: pesantren-fe

services:
  app:
    image: pesantren-fe:${IMAGE_TAG:-latest}
    container_name: pesantren-fe
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - API_URL=${API_URL}
    networks:
      - default
      - pesantren-network
    ports:
      - '127.0.0.1:${PORT}:${PORT}'
    restart: always

networks:
  pesantren-network:
    external: true
